id = "h3-max-turbo"
label = "MiniMax H3 Max Turbo (Yir)"
category = "VID"
platform = "yir"
endpoint = "minimax/h3-max-turbo"
mode = "async"
description = "Fast video generation with native audio, post-trained by fal from MiniMax H3"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.resolution]
label = "Resolution"
type = "select"
default = "768P"
options = [
  { value = "480p", label = "480p" },
  { value = "768P", label = "768P" },
]

[params.aspect_ratio]
label = "Aspect ratio"
type = "select"
default = "16:9"
options = [
  { value = "adaptive", label = "adaptive" },
  { value = "21:9", label = "21:9" },
  { value = "16:9", label = "16:9" },
  { value = "4:3", label = "4:3" },
  { value = "1:1", label = "1:1" },
  { value = "3:4", label = "3:4" },
  { value = "9:16", label = "9:16" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 5
max = 15

[inputs.text]
roles = []
duration = [5, 15]
[inputs.text.values]
resolution = ["480p", "768P"]
aspect_ratio = ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
generate_audio = [true]
n = [1]

[inputs.image]
roles = ["first_frame", "last_frame"]
duration = [5, 15]
[inputs.image.values]
resolution = ["480p", "768P"]
aspect_ratio = ["adaptive"]
generate_audio = [true]
n = [1]
