id = "minimax-h3-highspeed"
label = "MiniMax H3 Highspeed (Yir)"
category = "VID"
platform = "yir"
endpoint = "minimax/minimax-h3-highspeed"
mode = "async"
description = "MiniMax H3 Highspeed generates 768P video with audio from a reference image."

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration"

[params.resolution]
label = "Resolution"
type = "select"
default = "768P"
options = [
  { value = "768P", label = "768P" },
]

[params.aspect_ratio]
label = "Aspect ratio"
type = "select"
default = "adaptive"
options = [
  { value = "adaptive", label = "adaptive" },
  { value = "21:9", label = "21:9" },
  { value = "16:9", label = "16:9" },
  { value = "4:3", label = "4:3" },
  { value = "1:1", label = "1:1" },
  { value = "3:4", label = "3:4" },
  { value = "9:16", label = "9:16" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 4
max = 15

[inputs.reference]
roles = ["reference_image"]
duration = [4, 15]
[inputs.reference.values]
resolution = ["768P"]
aspect_ratio = ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
generate_audio = [true]
n = [1]
