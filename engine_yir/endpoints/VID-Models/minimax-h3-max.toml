id = "minimax-h3-max"
label = "MiniMax H3 Max (Yir)"
category = "VID"
platform = "yir"
endpoint = "minimax/minimax-h3-max"
mode = "async"
description = "MiniMax H3 Max video generation, post-trained by fal"

[general]
kind = "video"
prompt = "required"
slots = ["reference_images", "reference_videos", "reference_audios"]
duration_param_name = "duration"

[params.reference_images]
label = "Reference images"
type = "text"
list = true

[params.reference_videos]
label = "Reference videos"
type = "text"
list = true

[params.reference_audios]
label = "Reference audios"
type = "text"
list = true

[params.resolution]
label = "Resolution"
type = "select"
default = "480p"
options = [
  { value = "480p", label = "480p" },
  { value = "768P", label = "768P" },
]

[params.aspect_ratio]
label = "Aspect ratio"
type = "select"
default = "16:9"
options = [
  { value = "adaptive", label = "adaptive" },
  { value = "21:9", label = "21:9" },
  { value = "16:9", label = "16:9" },
  { value = "4:3", label = "4:3" },
  { value = "1:1", label = "1:1" },
  { value = "3:4", label = "3:4" },
  { value = "9:16", label = "9:16" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 5
max = 15

[inputs.text]
roles = []
duration = [5, 15]
[inputs.text.values]
resolution = ["480p", "768P"]
aspect_ratio = ["21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
generate_audio = [true]
n = [1]

[inputs.image]
roles = ["first_frame", "last_frame"]
duration = [5, 15]
[inputs.image.values]
resolution = ["480p", "768P"]
aspect_ratio = ["adaptive"]
generate_audio = [true]
n = [1]

[inputs.reference]
roles = ["reference_image", "reference_video", "reference_audio"]
duration = [5, 15]
[inputs.reference.values]
resolution = ["480p", "768P"]
aspect_ratio = ["adaptive", "21:9", "16:9", "4:3", "1:1", "3:4", "9:16"]
generate_audio = [true]
n = [1]
