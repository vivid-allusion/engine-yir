id = "minimax-h3-image-highspeed"
label = "MiniMax H3 Image Highspeed (Yir)"
category = "IMG"
platform = "yir"
endpoint = "minimax/minimax-h3-image-highspeed"
mode = "async"
description = "The fast MiniMax H3 Image variant for editing one reference into a square 4K image."

[general]
kind = "image"
prompt = "required"

[params.resolution]
label = "Resolution"
type = "select"
default = "4K"
options = [
  { value = "4K", label = "4K" },
]

[params.aspect_ratio]
label = "Aspect ratio"
type = "select"
default = "1:1"
options = [
  { value = "1:1", label = "1:1" },
]

[inputs.image]
roles = ["reference_image"]
[inputs.image.values]
resolution = ["4K"]
aspect_ratio = ["1:1"]
size = ["4096x4096"]
n = [1]
