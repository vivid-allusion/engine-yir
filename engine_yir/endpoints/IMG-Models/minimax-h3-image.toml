id = "minimax-h3-image"
label = "MiniMax H3 Image (Yir)"
category = "IMG"
platform = "yir"
endpoint = "minimax/minimax-h3-image"
mode = "async"
description = "MiniMax open-weight image model with 4K output and editing from up to 16 reference images"

[general]
kind = "image"
prompt = "required"

[params.resolution]
label = "Resolution"
type = "select"
default = "4K"
options = [
  { value = "1K", label = "1K" },
  { value = "2K", label = "2K" },
  { value = "4K", label = "4K" },
]

[params.aspect_ratio]
label = "Aspect ratio"
type = "select"
default = "1:1"
options = [
  { value = "1:1", label = "1:1" },
  { value = "2:3", label = "2:3" },
  { value = "3:2", label = "3:2" },
  { value = "3:4", label = "3:4" },
  { value = "4:3", label = "4:3" },
  { value = "4:5", label = "4:5" },
  { value = "5:4", label = "5:4" },
  { value = "9:16", label = "9:16" },
  { value = "16:9", label = "16:9" },
  { value = "21:9", label = "21:9" },
]

